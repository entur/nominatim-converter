description:
  en:
    localisedName: nominatim-converter
    shortDescription: Turns national geodata into a single Nominatim-compatible
      NDJSON dump that Photon can index.
    longDescription: >
      The data half of Entur's geocoder. Reads NeTEx stop places, Kartverket's
      address and place name registries, points of interest and OpenStreetMap
      extracts, and writes a Nominatim-compatible NDJSON dump that Photon
      indexes directly. One Rust binary, no database and no Nominatim install.
    documentation: https://github.com/entur/nominatim-converter#readme
    features:
      - NeTEx stop places and groups of stop places, with fare zones
      - Kartverket address registry (matrikkelen) and place names (SSR)
      - Points of interest from NeTEx
      - OpenStreetMap nodes, ways and relations from PBF extracts
      - Swedish addresses from Lantmäteriet GeoPackage
      - Importance weighting that drives search ranking

